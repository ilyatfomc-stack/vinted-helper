<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Flip Side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar, card lists */
:root{
  --bg:#F4E7C6; --surface:#FFF6DE; --ink:#3F2410; --muted:#7A5A3C; --line:#CDB083; --edge:#4A2C14; --field:#FFFBEF;
  --accent:#A8400E; --accent-ink:#FFF3D6; --accent-soft:#FBE6A8;
  --good:#4F5E1A; --good-soft:#DCE5A8; --warn:#8A4B00; --warn-soft:#F8D9A0; --bad:#A32A1A; --bad-soft:#F6C8B8;
  --nav:#4A2C14; --tagink:#3F2410; --s1:#B84A12; --s2:#E0A526; --s3:#6B7A2A;
  --f-display:"Caprasimo","Cooper Black","Bookman Old Style",Georgia,serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#241509; --surface:#34200F; --ink:#F4E7C6; --muted:#C2A47E; --line:#5A3E22; --edge:#8A6A44; --field:#2A1808;
  --accent:#E8A33A; --accent-ink:#2A1606; --accent-soft:#4A3114;
  --good:#B9CC6B; --good-soft:#3A4118; --warn:#F2B35E; --warn-soft:#4A3010; --bad:#FF9A85; --bad-soft:#4D1F16;
  --nav:#1A0E05; --tagink:#3F2410; --s1:#C8662B; --s2:#D79A22; --s3:#7E8F36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#241509; --surface:#34200F; --ink:#F4E7C6; --muted:#C2A47E; --line:#5A3E22; --edge:#8A6A44; --field:#2A1808;
  --accent:#E8A33A; --accent-ink:#2A1606; --accent-soft:#4A3114;
  --good:#B9CC6B; --good-soft:#3A4118; --warn:#F2B35E; --warn-soft:#4A3010; --bad:#FF9A85; --bad-soft:#4D1F16;
  --nav:#1A0E05; --tagink:#3F2410; --s1:#C8662B; --s2:#D79A22; --s3:#7E8F36; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.15} h2{font-size:18px} h3{font-size:15px;font-weight:500}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 10px;max-width:640px;margin:0 auto}
.bar small{color:var(--muted);font-size:12px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:6px 0 -4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--bg);color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--muted)} .stat b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe div{flex:1 1 60px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.pipe b{display:block;font-family:var(--f-mono);font-size:18px;color:var(--ink);font-weight:500}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{min-height:140px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{margin:0 0 10px;min-width:0}
button{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.bad{color:var(--bad)} button.sm{min-height:36px;padding:4px 10px;font-size:13px}
.act{border-left:4px solid var(--accent);border-radius:4px 10px 10px 4px}
.act.warn{border-left-color:var(--warn)} .act.bad{border-left-color:var(--bad)}
.item h3{overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px}
.preview{background:var(--accent-soft);border-radius:8px;padding:10px;font-size:14px}
.out{font-size:14px;display:grid;gap:8px}
.out div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.out div:last-child{border:0}
.check{display:flex;gap:10px;align-items:center;min-height:36px;font-size:14px;color:var(--ink);margin:0}
.check input{width:20px;min-height:20px;height:20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{flex:1;border:0;background:none;border-radius:0;color:var(--muted);font-size:11px;min-height:48px;padding:4px 0;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
@media (prefers-reduced-motion:no-preference){main{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
.lnk{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;margin:0 8px 8px 0;cursor:pointer}
.lnk.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

body{background:linear-gradient(var(--s1) 0 8px,var(--s2) 8px 16px,var(--s3) 16px 24px,var(--bg) 24px)}
.bar{padding-top:34px}
h1{font-size:22px;font-weight:400;line-height:1.1}
h2{font-weight:400}
h3{font-family:var(--f-body);font-weight:500}
.sec{font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--accent)}
.card,.stat,.pipe div{border:2px solid var(--edge);border-radius:14px}
input,select,textarea{background:var(--field);border:2px solid var(--edge);border-radius:10px}
button,.lnk{border:2px solid var(--edge);border-radius:99px}
button.pri,.lnk.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--edge)}
.preview{border:2px dashed var(--edge);border-radius:12px}
.act{position:relative;padding-left:26px;color:var(--tagink);background:var(--tg,#C9D58A);border:2px solid var(--edge);border-radius:2px 14px 14px 2px}
.act.warn{--tg:#F8D77A}
.act.bad{--tg:#F2A58A}
.act::before{content:"";position:absolute;left:8px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--edge);transform:translateY(-50%)}
.act .meta{color:#5E4126}
nav{background:var(--nav);border-top:3px solid var(--edge)}
nav button{color:#F0DDB4;border:0;border-radius:99px;margin:2px 1px;min-height:44px;padding:4px 0}
nav button[aria-current="page"]{background:var(--s2);color:#3F2410;border:0}
.pipe b,.stat b{color:var(--ink)}
.act,.act.warn,.act.bad{border-left:2px solid var(--edge)}
</style>

<div class="bar" style="align-items:center"><div><h1>The Flip Side</h1><small id="today-date"></small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:0 0 auto"><a class="lnk" style="margin:0;min-height:36px;justify-content:center" href="https://www.vinted.com" target="_blank" rel="noopener">Open Vinted</a><button class="sm" id="theme-btn" data-act="theme" aria-label="Change color theme">Theme: Auto</button></div></div>
<main id="view"></main>
<div id="toast" hidden></div>
<nav id="nav" aria-label="Sections"></nav>

<script>
var STATUSES=["Sourced","Listed","Sold","Shipped","Completed"];
var CONDITIONS=["New with tags","New without tags","Excellent","Good","Satisfactory"];
var FEE_PCT=0.05,FEE_FLAT=0.70,SHIP_WARN=3,STALE=30,DEF_PACK=0.75;
var KEY="vinted_helper_v1";
var TABS=[["today","Today"],["buy","Buy"],["add","Add"],["scan","Scan"],["stock","Stock"],["listing","Listing"],["price","Price"]];
var state={tab:"today",editing:null,filter:"All",selling:null,armDelete:null,listId:null,items:[],scan:{img:"",busy:false,err:"",result:null,price:0},buy:{ok:false}};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v).replace("$","").trim());return isNaN(n)?0:n}
function money(n){n=Math.round(n*100)/100;return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function daysSince(s){if(!s)return 0;var d=new Date(s+"T00:00:00");var t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((t-d)/864e5))}
function isSold(it){return it.status==="Sold"||it.status==="Shipped"||it.status==="Completed"}
function profit(it){var price=(isSold(it)&&it.sold_price)?it.sold_price:it.list_price;var ship=it.free_shipping?it.ship_cost:0;return price-it.cost-it.packaging-ship}
function buyerTotal(p,s){return p+s+p*FEE_PCT+FEE_FLAT}

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var a=JSON.parse(raw);if(Array.isArray(a)){state.items=a;return}}}catch(e){}
  state.items=examples();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state.items))}catch(e){}}
function examples(){
  function mk(id,o){return Object.assign({id:id,example:true,category:"",measurements:"",notes:"",packaging:DEF_PACK,free_shipping:0,ship_cost:0,sold_price:0,date_added:daysAgo(40),date_listed:"",date_sold:""},o)}
  return [
    mk(1,{title:"501 jeans",brand:"Levi's",category:"Jeans",size:"W30 L32",color:"Blue",condition:"Good",flaws:"Small fray at hem",cost:5,list_price:28,status:"Sold",date_listed:daysAgo(12),date_sold:daysAgo(3),sold_price:26}),
    mk(2,{title:"Zip hoodie",brand:"Nike",category:"Hoodie",size:"M",color:"Grey",condition:"Excellent",flaws:"",cost:6,list_price:30,status:"Sourced"}),
    mk(3,{title:"Wool blazer",brand:"Zara",category:"Blazer",size:"S",color:"Black",condition:"Good",flaws:"",cost:4,list_price:24,status:"Listed",date_listed:daysAgo(34)})
  ];
}

function stats(){
  var it=state.items,sold=it.filter(isSold);
  var counts={};STATUSES.forEach(function(s){counts[s]=it.filter(function(i){return i.status===s}).length});
  var rev=0,pr=0;sold.forEach(function(i){rev+=i.sold_price;pr+=profit(i)});
  var tied=0;it.forEach(function(i){if(i.status==="Sourced"||i.status==="Listed")tied+=i.cost});
  return {counts:counts,rev:rev,pr:pr,avg:sold.length?pr/sold.length:0,tied:tied,
    ship:it.filter(function(i){return i.status==="Sold"}),
    list:it.filter(function(i){return i.status==="Sourced"}),
    stale:it.filter(function(i){return i.status==="Listed"&&daysSince(i.date_listed)>=STALE})};
}
function buildListing(it){
  var parts=[it.brand,it.title,it.size?"Size "+it.size:"",it.color].filter(Boolean);
  var title=parts.join(" - ").slice(0,100);
  var L=["Condition: "+it.condition];
  if(it.size)L.push("Size: "+it.size);
  if(it.measurements)L.push("Measurements: "+it.measurements);
  L.push("Flaws: "+(it.flaws||"None that I can see - see photos."));
  if(it.notes)L.push(it.notes);
  L.push("Smoke-free home. Ships within 1-2 days. Bundle 2+ items for a discount!");
  var tags=[it.brand,it.category,it.color].filter(Boolean).map(function(w){return "#"+w.toLowerCase().replace(/[^a-z0-9]/g,"")}).join(" ");
  if(tags)L.push(tags);
  return {title:title,body:L.join("\n")};
}

var TK="vinted_helper_theme";
var THEME_NEXT={auto:"light",light:"dark",dark:"auto"},THEME_NAME={auto:"Auto",light:"Light",dark:"Dark"};
function getTheme(){try{var t=localStorage.getItem(TK);return THEME_NAME[t]?t:"auto"}catch(e){return "auto"}}
function applyTheme(t){
  var r=document.documentElement;
  if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
  var b=document.getElementById("theme-btn");if(b)b.textContent="Theme: "+THEME_NAME[t];
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
function copy(text,el){
  var done=function(){toast("Copied")};
  var fallback=function(){if(el){el.focus();el.select();}toast("Press and hold to copy")};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

function chipFor(s){return s==="Sold"?"warn":(s==="Completed"||s==="Shipped")?"good":s==="Sourced"?"mute":""}

function vToday(){
  var s=stats(),h="";
  var hasEx=state.items.some(function(i){return i.example});
  if(hasEx)h+='<div class="card row between"><span class="meta">Example items are shown so you can see how it works.</span><button class="sm" data-act="clear-examples">Clear examples</button></div>';
  h+='<div class="sec">Your next actions</div>';
  var acts="";
  s.ship.forEach(function(i){var d=daysSince(i.date_sold);var late=d>=SHIP_WARN;
    acts+='<div class="card act '+(late?"bad":"warn")+'"><div class="row between"><h3>Ship: '+esc(i.title)+'</h3><span class="chip '+(late?"bad":"warn")+'">Sold '+d+'d ago</span></div><div class="meta">'+(late?"Ship now, the deadline is close.":"Vinted gives about 5 days to ship.")+'</div></div>'});
  s.list.forEach(function(i){acts+='<div class="card act"><div class="row between"><h3>List: '+esc(i.title)+'</h3><button class="sm" data-act="to-listing" data-id="'+i.id+'">Make text</button></div><div class="meta">Sourced, not listed yet.</div></div>'});
  s.stale.forEach(function(i){acts+='<div class="card act warn"><div class="row between"><h3>Refresh: '+esc(i.title)+'</h3><span class="chip warn">'+daysSince(i.date_listed)+' days</span></div><div class="meta">Lower the price, reshoot photos, or relist.</div></div>'});
  h+=acts||'<div class="card empty">Nothing urgent. Source and add more items.</div>';
  h+='<div class="sec">Pipeline</div><div class="pipe">'+STATUSES.map(function(k){return '<div><b>'+s.counts[k]+'</b>'+k+'</div>'}).join("")+'</div>';
  h+='<div class="sec">Money</div><div class="stats">'
    +'<div class="stat"><span>Profit</span><b style="color:'+(s.pr>=0?"var(--good)":"var(--bad)")+'">'+money(s.pr)+'</b></div>'
    +'<div class="stat"><span>Revenue</span><b>'+money(s.rev)+'</b></div>'
    +'<div class="stat"><span>Avg profit per sale</span><b>'+money(s.avg)+'</b></div>'
    +'<div class="stat"><span>Cash in unsold stock</span><b>'+money(s.tied)+'</b></div></div>';
  h+='<p class="meta">Vinted charges sellers 0%. Buyers pay a Buyer Protection fee plus shipping, so keep item price and shipping looking like a deal.</p>';
  return h;
}

function fld(id,label,val,type,extra){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" '+(type==="number"?'inputmode="decimal" step="0.01" ':"")+'value="'+esc(val)+'" '+(extra||"")+'></div>'}
function vAdd(){
  var it=state.editing?state.items.filter(function(i){return i.id===state.editing})[0]:null;
  it=it||{title:"",brand:"",category:"",size:"",color:"",measurements:"",flaws:"",notes:"",condition:"Excellent",cost:"",packaging:DEF_PACK,list_price:"",free_shipping:0,ship_cost:""};
  var h='<div class="card" id="form"><h2>'+(state.editing?"Edit item":"Add item")+'</h2><div style="height:12px"></div>'
   +fld("f-title","Item (e.g. 501 jeans)",it.title)
   +'<div class="grid2">'+fld("f-brand","Brand",it.brand)+fld("f-category","Category",it.category)+fld("f-size","Size",it.size)+fld("f-color","Color",it.color)+'</div>'
   +fld("f-measurements","Measurements",it.measurements)+fld("f-flaws","Flaws (be honest)",it.flaws)+fld("f-notes","Extra notes",it.notes)
   +'<div class="field"><label for="f-condition">Condition</label><select id="f-condition">'+CONDITIONS.map(function(c){return '<option'+(c===it.condition?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'
   +'<div class="grid2">'+fld("f-cost","What you paid ($)",it.cost,"number")+fld("f-packaging","Packaging ($)",it.packaging,"number")+fld("f-list_price","List price ($)",it.list_price,"number")+fld("f-ship_cost","Shipping if you pay ($)",it.ship_cost,"number")+'</div>'
   +'<label class="check" for="f-free"><input id="f-free" type="checkbox"'+(it.free_shipping?" checked":"")+'>I am offering free shipping</label>'
   +'<div class="preview" id="f-preview" style="margin:10px 0 12px"></div>'
   +'<div class="row"><button class="pri" data-act="save">Save item</button><button data-act="clear-form">Clear</button></div></div>';
  return h;
}
function readForm(){
  var g=function(k){return document.getElementById("f-"+k).value.trim()};
  var d={};["title","brand","category","size","color","measurements","flaws","notes","condition"].forEach(function(k){d[k]=g(k)});
  ["cost","packaging","list_price","ship_cost"].forEach(function(k){d[k]=num(g(k))});
  d.free_shipping=document.getElementById("f-free").checked?1:0;return d;
}
function formPreview(){
  var el=document.getElementById("f-preview");if(!el)return;
  var d=readForm();d.status="Listed";d.sold_price=0;
  el.innerHTML='Estimated profit: <b class="num">'+money(profit(d))+'</b><br><span class="meta">Buyer pays about '+money(buyerTotal(d.list_price,d.free_shipping?0:4))+' with fee and about $4 shipping.</span>';
}

function nextBtn(i){
  var m={Sourced:["listed","Mark listed"],Listed:["sold","Mark sold"],Sold:["shipped","Mark shipped"],Shipped:["completed","Complete"]}[i.status];
  return m?'<button class="sm pri" data-act="'+m[0]+'" data-id="'+i.id+'">'+m[1]+'</button>':"";
}
function vStock(){
  var h='<div class="row between"><div style="flex:1;min-width:140px"><label for="flt">Show</label><select id="flt"><option>All</option>'+STATUSES.map(function(s){return '<option'+(s===state.filter?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div></div>';
  var list=state.items.filter(function(i){return state.filter==="All"||i.status===state.filter});
  if(!list.length)h+='<div class="card empty">No items here yet.<br>Add one from the Add item tab.</div>';
  list.slice().sort(function(a,b){return b.id-a.id}).forEach(function(i){
    var ref=i.status==="Listed"?i.date_listed:(isSold(i)?i.date_sold:i.date_added);
    h+='<div class="card item"><div class="row between"><h3>'+esc(i.title)+'</h3><span class="chip '+chipFor(i.status)+'">'+i.status+'</span></div>'
     +'<div class="meta">'+esc([i.brand,i.size].filter(Boolean).join(" · "))+(i.example?' · <span class="chip mute">Example</span>':"")+'</div>'
     +'<div class="row between" style="margin:8px 0"><span class="num">'+money(isSold(i)&&i.sold_price?i.sold_price:i.list_price)+'</span><span class="num" style="color:'+(profit(i)>=0?"var(--good)":"var(--bad)")+'">'+money(profit(i))+' profit</span><span class="meta">'+daysSince(ref)+'d</span></div>';
    if(state.selling===i.id){

var GK="vinted_helper_akey";
var AAPI="https://api.anthropic.com/v1/messages";
var AMODEL="claude-haiku-5-5";
var SCAN_PROMPT="You help a reseller list used clothing and goods on Vinted. Look at the photo and answer with one JSON object with these keys: title (short item name without the brand, such as straight leg jeans), brand (empty string unless you can see it on a tag or logo), brand_from_tag (true only if the brand text is readable in the photo), category (one or two words), size (empty string unless readable on a tag), size_from_tag (true only if the size is readable), color (main color), condition (one of: New with tags, New without tags, Excellent, Good, Satisfactory), flaws (visible flaws, or an empty string). Never guess a brand or a size. Return only the JSON.";
function getKey(){try{return localStorage.getItem(GK)||""}catch(e){return ""}}
function putKey(k){try{localStorage.setItem(GK,k)}catch(e){}}
function dropKey(){try{localStorage.removeItem(GK)}catch(e){}}
function freshScan(){return {img:"",busy:false,err:"",result:null,price:0}}
function friendly(m){
  m=String(m||"");
  if(/invalid x-api-key|authentication|401/i.test(m))return "Anthropic rejected the key. Remove it and save it again.";
  if(/credit|billing|balance/i.test(m))return "Your Anthropic account is out of credit. Add a few dollars in the Console.";
  if(/rate|429|overloaded|529/i.test(m))return "Too many requests right now. Wait a moment and try again.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Could not reach Anthropic. Check your connection and try again.";
  return m||"Something went wrong. Try again.";
}
function readPhoto(file){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();
    img.onload=function(){var k=Math.min(1,1024/Math.max(img.width,img.height));
      var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.82))};
    img.onerror=function(){rej(new Error("Could not read that photo"))};img.src=fr.result};
  fr.onerror=function(){rej(new Error("Could not read that photo"))};fr.readAsDataURL(file)})}
async function runScan(){
  var sc=state.scan,key=getKey();
  if(sc.busy)return;
  sc.busy=true;sc.err="";render();
  try{
    var b64=sc.img.split(",")[1];
    var r=await fetch(AAPI,{method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AMODEL,max_tokens:600,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:SCAN_PROMPT}]}]})});
    var j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error((j.error&&j.error.message)||("Error "+r.status));
    var t=(j.content&&j.content[0]&&j.content[0].text)||"";
    var m=t.match(/\{[\s\S]*\}/);
    if(!m)throw new Error("The model gave no answer.");
    sc.result=JSON.parse(m[0]);
  }catch(e){sc.err=friendly(e&&e.message)}
  sc.busy=false;render();
}

function buyCalc(){
  var el=document.getElementById("b-out");if(!el)return;
  var g=function(id){return document.getElementById(id).value};
  var pe=document.getElementById("b-prompt");if(pe)pe.value=buyPrompt();
  var shelf=num(g("b-price")),min=num(g("b-min")),fee=Math.min(Math.max(num(g("b-fee")),0),50)/100;
  var comps=(g("b-comps").match(/\d+(\.\d+)?/g)||[]).map(Number).sort(function(a,b){return a-b});
  var q=g("b-q").trim();
  var lk=document.getElementById("b-links");
  if(lk)lk.innerHTML=q?srcLinks(q):'<span class="meta">Type search words to get comparison links.</span>';
  if(!comps.length||!shelf){el.innerHTML='<span class="meta">Enter the shelf price and 3 to 5 prices you found. The verdict appears here.</span>';state.buy={ok:false};return}
  var n=comps.length,med=n%2?comps[(n-1)/2]:(comps[n/2-1]+comps[n/2])/2;
  var net=med*(1-fee)-DEF_PACK,pf=net-shelf,roi=pf/shelf*100,maxPay=Math.max(0,net-min);
  var verdict,cls,note;
  if(pf<=0){verdict="Skip";cls="bad";note="You would lose money at this price."}
  else if(pf>=min&&n>=3){verdict="Buy";cls="good";note="Meets your minimum profit."}
  else if(pf<min){verdict="Maybe";cls="warn";note="Profit is below your minimum."}
  else{verdict="Maybe";cls="warn";note="Only "+n+" price"+(n===1?"":"s")+". Find at least 3 for a firmer answer."}
  if(comps[n-1]>comps[0]*2)note+=" The prices vary a lot, so match the condition and size.";
  state.buy={ok:true,med:med};
  el.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap"><span class="chip '+cls+'" style="font-size:16px;padding:4px 14px">'+verdict+'</span><span class="meta">'+note+'</span></div>'
   +'<div class="out">'
   +'<div><span>Typical resale (median of '+n+')</span><b class="num">'+money(med)+'</b></div>'
   +'<div><span>You keep after fees and packaging</span><b class="num">'+money(net)+'</b></div>'
   +'<div><span>Profit at the shelf price</span><b class="num" style="color:'+(pf>=0?"var(--good)":"var(--bad)")+'">'+money(pf)+'</b></div>'
   +'<div><span>Return on what you pay</span><b class="num">'+Math.round(roi)+'%</b></div>'
   +'<div><span>Most you should pay</span><b class="num">'+money(maxPay)+'</b></div></div>';
}

  else if(a==="save-key"){var kv=document.getElementById("g-key").value.trim();if(!kv){toast("Paste your key first");return}putKey(kv);render()}
  else if(a==="forget-key"){dropKey();state.scan=freshScan();render()}
  else if(a==="scan-go"){runScan()}
  else if(a==="scan-reset"){state.scan=freshScan();render()}
  else if(a==="scan-add"){
    var sg=function(i){return document.getElementById(i).value.trim()};
    if(!sg("s-title")){toast("Give the item a name first");return}
    var sid=state.items.reduce(function(m,i){return Math.max(m,i.id)},0)+1;
    state.items.push({id:sid,status:"Sourced",date_added:today(),date_listed:"",date_sold:"",sold_price:0,title:sg("s-title"),brand:sg("s-brand"),category:sg("s-category"),size:sg("s-size"),color:sg("s-color"),measurements:"",flaws:sg("s-flaws"),notes:"",condition:sg("s-condition"),cost:num(sg("s-cost")),packaging:DEF_PACK,list_price:state.scan.price,free_shipping:0,ship_cost:0});
    persist();toast("Added to inventory");state.scan=freshScan();go("stock");
  }
  else if(a==="theme"){var nt=THEME_NEXT[getTheme()];try{localStorage.setItem(TK,nt)}catch(err){}applyTheme(nt);toast("Theme: "+THEME_NAME[nt])}
  else if(a==="buy-copy"){copy(document.getElementById("b-prompt").value,document.getElementById("b-prompt"))}
  else if(a==="buy-add"){
    var bg=function(i){return document.getElementById(i).value.trim()};
    var bshelf=num(bg("b-price"));
    if(!bg("b-q")){toast("Add search words so the item has a name");return}
    if(!bshelf){toast("Enter the shelf price");return}
    var bid=state.items.reduce(function(m,i){return Math.max(m,i.id)},0)+1;
    state.items.push({id:bid,status:"Sourced",date_added:today(),date_listed:"",date_sold:"",sold_price:0,title:bg("b-q"),brand:"",category:"",size:"",color:"",measurements:"",flaws:"",notes:"",condition:"Good",cost:bshelf,packaging:DEF_PACK,list_price:(state.buy&&state.buy.ok)?Math.round(state.buy.med):0,free_shipping:0,ship_cost:0});
    persist();toast("Added to inventory");go("stock");
  }
  else if(a==="clear-examples"){state.items=state.items.filter(function(i){return !i.example});persist();render()}
  else if(a==="copy-val"){copy(b.getAttribute("data-v"),null)}
  else if(a==="copy-title"){copy(document.getElementById("l-title").value,document.getElementById("l-title"))}
  else if(a==="copy-body"){copy(document.getElementById("l-body").value,document.getElementById("l-body"))}
  else if(a==="copy-backup"){copy(JSON.stringify(state.items),document.getElementById("restore"))}
  else if(a==="copy-csv"){copy(csv(),document.getElementById("restore"))}
  else if(a==="restore"){
    try{var arr=JSON.parse(document.getElementById("restore").value);
      if(!Array.isArray(arr)||!arr.every(function(x){return x&&typeof x.title==="string"&&typeof x.id==="number"}))throw 0;
      state.items=arr;persist();toast("Backup restored");render();
    }catch(err){toast("That is not a valid backup")}
  }
});
document.addEventListener("input",function(e){
  if(e.target.closest("#form"))formPreview();
  if(e.target.closest("#price"))calcPrice();
  if(e.target.closest("#scanform"))scanSuggest();
  if(e.target.closest("#buyform"))buyCalc();
});
document.addEventListener("change",function(e){
  if(e.target.id==="g-cam"||e.target.id==="g-pick"){
    var f=e.target.files&&e.target.files[0];
    if(f)readPhoto(f).then(function(u){state.scan.img=u;state.scan.result=null;state.scan.err="";render()}).catch(function(er){state.scan.err=er.message;render()});
  }
  if(e.target.id==="flt"){state.filter=e.target.value;render()}
  if(e.target.id==="l-item"){state.listId=parseInt(e.target.value,10)||null;render()}
});

document.getElementById("today-date").textContent=new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
applyTheme(getTheme());
load();render();
</script>
